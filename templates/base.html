<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{% endblock %} | Shieldline</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
{% if session.user %}{% set ep = request.endpoint or '' %}<aside><h2>Shieldline</h2>
<a href="{{ url_for('dashboard') }}" class="{{ 'on' if ep=='dashboard' }}">Dashboard</a>
<a href="{{ url_for('customers') }}" class="{{ 'on' if ep.startswith('customer') }}">Customers</a>
<a href="{{ url_for('policies') }}" class="{{ 'on' if ep.startswith('polic') }}">Policies</a>
<a href="{{ url_for('claims') }}" class="{{ 'on' if ep.startswith('claim') }}">Claims</a>
<div class="who">{{ session.user }}<br><a href="{{ url_for('logout') }}">Sign out</a></div></aside>{% endif %}
<main class="{{ 'app' if session.user }}">{% for cat, m in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}</main></body></html>
